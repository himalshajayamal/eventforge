name: eventforge-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - eventforge_prod_pgdata:/var/lib/postgresql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *default-logging
    networks: [backend]

  api:
    build:
      context: ./apps/api
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-access-log
      - --proxy-headers
      - --forwarded-allow-ips=*
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
      EVENTFORGE_ENV: production
      EVENTFORGE_ADMIN_USER: ${EVENTFORGE_ADMIN_USER:?set EVENTFORGE_ADMIN_USER in .env.production}
      EVENTFORGE_ADMIN_PASSWORD: ${EVENTFORGE_ADMIN_PASSWORD:?set EVENTFORGE_ADMIN_PASSWORD in .env.production}
      EVENTFORGE_WEBHOOK_MASTER_SECRET: ${EVENTFORGE_WEBHOOK_MASTER_SECRET:?set EVENTFORGE_WEBHOOK_MASTER_SECRET in .env.production}
      EVENTFORGE_REQUIRE_SIGNED_WEBHOOKS: "1"
      EVENTFORGE_MAX_INGEST_BYTES: ${EVENTFORGE_MAX_INGEST_BYTES:-1048576}
      EVENTFORGE_HTTP_ACTION_MAX_RESPONSE_BYTES: ${EVENTFORGE_HTTP_ACTION_MAX_RESPONSE_BYTES:-1048576}
      EVENTFORGE_ALLOW_PRIVATE_HTTP_ACTIONS: "0"
      EVENTFORGE_ALLOW_INSECURE_HTTP_ACTIONS: "0"
      EVENTFORGE_HTTP_ACTION_ALLOWED_PORTS: ${EVENTFORGE_HTTP_ACTION_ALLOWED_PORTS:-443}
      PYTHONDONTWRITEBYTECODE: "1"
    expose: ["8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging
    networks: [edge, backend]

  worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
      EVENTFORGE_ENV: production
      EVENTFORGE_WORKER_POLL_SECONDS: ${EVENTFORGE_WORKER_POLL_SECONDS:-0.5}
      EVENTFORGE_JOB_LEASE_SECONDS: ${EVENTFORGE_JOB_LEASE_SECONDS:-30}
      EVENTFORGE_JOB_HEARTBEAT_SECONDS: ${EVENTFORGE_JOB_HEARTBEAT_SECONDS:-10}
      EVENTFORGE_RETRY_BASE_SECONDS: ${EVENTFORGE_RETRY_BASE_SECONDS:-2}
      EVENTFORGE_RETRY_MAX_SECONDS: ${EVENTFORGE_RETRY_MAX_SECONDS:-600}
      EVENTFORGE_HTTP_ACTION_MAX_RESPONSE_BYTES: ${EVENTFORGE_HTTP_ACTION_MAX_RESPONSE_BYTES:-1048576}
      EVENTFORGE_ALLOW_PRIVATE_HTTP_ACTIONS: "0"
      EVENTFORGE_ALLOW_INSECURE_HTTP_ACTIONS: "0"
      EVENTFORGE_HTTP_ACTION_ALLOWED_PORTS: ${EVENTFORGE_HTTP_ACTION_ALLOWED_PORTS:-443}
      PYTHONDONTWRITEBYTECODE: "1"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    logging: *default-logging
    networks: [backend, egress]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    expose: ["80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging
    networks: [edge]

  caddy:
    image: caddy:2.11.4-alpine
    environment:
      EVENTFORGE_PUBLIC_HOST: ${EVENTFORGE_PUBLIC_HOST:?set EVENTFORGE_PUBLIC_HOST in .env.production}
    ports:
      - "${EVENTFORGE_HTTP_BIND:-80}:80"
      - "${EVENTFORGE_HTTPS_BIND:-443}:443"
      - "${EVENTFORGE_HTTPS_BIND:-443}:443/udp"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - eventforge_caddy_data:/data
      - eventforge_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    networks: [edge]

  backup:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    entrypoint: ["/bin/sh", "/usr/local/bin/eventforge-backup"]
    volumes:
      - ./tools/backup_postgres.sh:/usr/local/bin/eventforge-backup:ro
      - ${EVENTFORGE_BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    profiles: ["ops"]
    networks: [backend]

volumes:
  eventforge_prod_pgdata:
  eventforge_caddy_data:
  eventforge_caddy_config:

networks:
  edge:
  egress:
  backend:
    internal: true
