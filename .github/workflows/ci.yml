name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: eventforge
          POSTGRES_USER: eventforge
          POSTGRES_PASSWORD: eventforge_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventforge -d eventforge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://eventforge:eventforge_dev_only@localhost:5432/eventforge
      PGPASSWORD: eventforge_dev_only

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Python dependencies
        working-directory: apps/api
        run: pip install -r requirements.txt
      - name: Apply database migrations
        run: |
          for migration in database/migrations/*.sql; do
            psql -h localhost -U eventforge -d eventforge -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Run Python tests
        working-directory: apps/api
        run: python -m pytest -q

  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npm run build
