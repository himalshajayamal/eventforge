name: eventforge

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventforge}
      POSTGRES_USER: ${POSTGRES_USER:-eventforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventforge_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - eventforge_pgdata:/var/lib/postgresql
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eventforge} -d ${POSTGRES_DB:-eventforge}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://eventforge:eventforge_dev_only@db:5432/eventforge}
      EVENTFORGE_ADMIN_USER: ${EVENTFORGE_ADMIN_USER:-eventforge}
      EVENTFORGE_ADMIN_PASSWORD: ${EVENTFORGE_ADMIN_PASSWORD:-eventforge_dev_only_admin}
      EVENTFORGE_MAX_INGEST_BYTES: ${EVENTFORGE_MAX_INGEST_BYTES:-1048576}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./apps/api
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://eventforge:eventforge_dev_only@db:5432/eventforge}
      EVENTFORGE_WORKER_POLL_SECONDS: ${EVENTFORGE_WORKER_POLL_SECONDS:-0.5}
      EVENTFORGE_JOB_LEASE_SECONDS: ${EVENTFORGE_JOB_LEASE_SECONDS:-30}
      EVENTFORGE_RETRY_BASE_SECONDS: ${EVENTFORGE_RETRY_BASE_SECONDS:-2}
      EVENTFORGE_RETRY_MAX_SECONDS: ${EVENTFORGE_RETRY_MAX_SECONDS:-600}
      EVENTFORGE_HTTP_ACTION_MAX_RESPONSE_BYTES: ${EVENTFORGE_HTTP_ACTION_MAX_RESPONSE_BYTES:-1048576}
      EVENTFORGE_ALLOW_PRIVATE_HTTP_ACTIONS: ${EVENTFORGE_ALLOW_PRIVATE_HTTP_ACTIONS:-0}
      EVENTFORGE_ALLOW_INSECURE_HTTP_ACTIONS: ${EVENTFORGE_ALLOW_INSECURE_HTTP_ACTIONS:-0}
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 5s


  test:
    build:
      context: ./apps/api
    command: ["python", "tests/run_isolated.py"]
    environment:
      EVENTFORGE_TEST_ADMIN_DATABASE_URL: ${EVENTFORGE_TEST_ADMIN_DATABASE_URL:-postgresql://eventforge:eventforge_dev_only@db:5432/postgres}
      EVENTFORGE_TEST_DATABASE_URL: ${EVENTFORGE_TEST_DATABASE_URL:-postgresql://eventforge:eventforge_dev_only@db:5432/eventforge_test}
      EVENTFORGE_TEST_DATABASE_NAME: ${EVENTFORGE_TEST_DATABASE_NAME:-eventforge_test}
      EVENTFORGE_TEST_MIGRATIONS_DIR: /migrations
      EVENTFORGE_ADMIN_USER: ${EVENTFORGE_ADMIN_USER:-eventforge}
      EVENTFORGE_ADMIN_PASSWORD: ${EVENTFORGE_ADMIN_PASSWORD:-eventforge_dev_only_admin}
      EVENTFORGE_MAX_INGEST_BYTES: ${EVENTFORGE_MAX_INGEST_BYTES:-1048576}
      EVENTFORGE_HTTP_ACTION_MAX_RESPONSE_BYTES: ${EVENTFORGE_HTTP_ACTION_MAX_RESPONSE_BYTES:-1048576}
      EVENTFORGE_ALLOW_PRIVATE_HTTP_ACTIONS: ${EVENTFORGE_ALLOW_PRIVATE_HTTP_ACTIONS:-0}
      EVENTFORGE_ALLOW_INSECURE_HTTP_ACTIONS: ${EVENTFORGE_ALLOW_INSECURE_HTTP_ACTIONS:-0}
    volumes:
      - ./database/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    profiles: ["test"]

  web:
    build:
      context: ./apps/web
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  eventforge_pgdata:
